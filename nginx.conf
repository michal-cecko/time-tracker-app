server {
  listen       80;
  server_name  _;
  root   /usr/share/nginx/html;
  index  index.html;

  # Long-cache static assets (hashed by Vite)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback — every unknown route resolves to index.html.
  # /api and /realtime are handled by Traefik on the same host and never
  # reach this container, so no need to special-case them here.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't cache the entry HTML
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Compress text-y responses
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
