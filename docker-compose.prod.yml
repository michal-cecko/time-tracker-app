# Lapse web — production deploy for Dokploy on the VPS.
#   Catches lapse.cecko.dev/* except /api, /realtime, /docs (claimed by lapse-api at priority 100).
#   Runs on the `dokploy-network` overlay.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: https://lapse.cecko.dev/api/v1
    container_name: lapse-web
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      # HTTP router (redirects to HTTPS)
      - "traefik.http.routers.lapse-web.rule=Host(`lapse.cecko.dev`)"
      - "traefik.http.routers.lapse-web.entrypoints=web"
      - "traefik.http.routers.lapse-web.middlewares=lapse-web-redirect"
      - "traefik.http.routers.lapse-web.priority=10"

      # HTTPS — catch-all on same host, priority 10 (below api's 100)
      - "traefik.http.routers.lapse-web-secure.rule=Host(`lapse.cecko.dev`)"
      - "traefik.http.routers.lapse-web-secure.entrypoints=websecure"
      - "traefik.http.routers.lapse-web-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lapse-web-secure.priority=10"

      # Service
      - "traefik.http.services.lapse-web.loadbalancer.server.port=80"

      # Redirect middleware
      - "traefik.http.middlewares.lapse-web-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.lapse-web-redirect.redirectscheme.permanent=true"
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
